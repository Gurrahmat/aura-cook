<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Library – AuraCook</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-auracook">
    <div class="container-fluid">
      <a class="navbar-brand-auracook" href="index.html">
        <i class="fas fa-utensils"></i> AuraCook
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <i class="fas fa-bars text-dark fs-4"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item">
            <a class="nav-link-auracook" href="index.html">
              <i class="fas fa-home"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link-auracook active" href="recipes.html">
              <i class="fas fa-book-open"></i> Recipes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link-auracook" href="cooking.html">
              <i class="fas fa-fire-burner"></i> Cooking Mode
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link-auracook" href="pantry.html">
              <i class="fas fa-box-open"></i> Pantry
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-auracook-secondary btn-toggle-timer position-relative">
            <i class="fas fa-stopwatch me-1"></i> Timers
            <span class="badge-timer-count ms-1">0</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Content Container -->
  <main class="container py-4">
    
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4">
      <div>
        <h1 class="h2 font-serif mb-1">Recipe Library</h1>
        <p class="text-muted mb-0">Explore curated recipes paired with intelligent pantry stock matching.</p>
      </div>
      <div class="mt-3 mt-md-0">
        <div class="form-check form-switch p-2 glass-panel ps-5 pe-3 d-inline-flex align-items-center">
          <input class="form-check-input me-2" type="checkbox" id="filter-pantry-match">
          <label class="form-check-input-label fw-bold text-sage small mb-0" for="filter-pantry-match">
            <i class="fas fa-basket-shopping me-1 text-terracotta"></i> Show Only "Can Make Now"
          </label>
        </div>
      </div>
    </div>

    <!-- Search & Filters Toolbar -->
    <div class="glass-panel p-3 mb-4">
      <div class="row g-3 align-items-center">
        <!-- Search Input -->
        <div class="col-lg-4">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0" id="search-input" placeholder="Search recipe or ingredient...">
          </div>
        </div>

        <!-- Category Dropdown -->
        <div class="col-md-4 col-lg-3">
          <select class="form-select" id="filter-category">
            <option value="all">All Categories</option>
            <option value="Main Course">Main Course</option>
            <option value="Quick & Easy">Quick & Easy</option>
            <option value="Vegetarian">Vegetarian</option>
            <option value="Seafood">Seafood</option>
          </select>
        </div>

        <!-- Difficulty Filter -->
        <div class="col-md-4 col-lg-3">
          <select class="form-select" id="filter-difficulty">
            <option value="all">All Difficulties</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>

        <!-- Reset Button -->
        <div class="col-md-4 col-lg-2 text-end">
          <button class="btn btn-outline-secondary w-100" id="btn-reset-filters">
            <i class="fas fa-rotate-left me-1"></i> Reset
          </button>
        </div>
      </div>
    </div>

    <!-- Recipes Grid -->
    <div class="row g-4" id="recipes-grid">
      <!-- Cards rendered dynamically -->
    </div>

    <!-- Empty State -->
    <div class="text-center py-5 d-none" id="empty-recipes-state">
      <i class="fas fa-utensils-slash fa-3x text-muted mb-3"></i>
      <h3>No Recipes Found</h3>
      <p class="text-muted">Try adjusting your search terms or turning off the "Can Make Now" filter.</p>
    </div>

  </main>

  <!-- Recipe Detail Modal -->
  <div class="modal fade" id="recipeDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content glass-panel border-0 overflow-hidden">
        <div class="modal-header border-0 bg-sage-dark text-white p-4">
          <h4 class="modal-title font-serif" id="modalRecipeTitle">Recipe Title</h4>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="modalRecipeBody">
          <!-- Rendered dynamically -->
        </div>
        <div class="modal-footer border-0 p-4 pt-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <a href="#" id="modalStartCookBtn" class="btn btn-auracook-primary">
            <i class="fas fa-fire me-1"></i> Start Cooking Mode
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Multi-Timer Drawer Component -->
  <div class="timer-drawer-overlay" id="timer-drawer-overlay"></div>
  <div class="timer-drawer" id="timer-drawer">
    <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
      <h4 class="font-serif mb-0"><i class="fas fa-stopwatch text-terracotta me-2"></i>Kitchen Timers</h4>
      <button class="btn-close" id="close-timer-drawer"></button>
    </div>
    
    <div class="mb-3">
      <button class="btn btn-auracook-primary w-100" onclick="promptCreateTimer()">
        <i class="fas fa-plus me-1"></i> Add Custom Timer
      </button>
    </div>

    <div id="timer-list-container" class="flex-grow-1 overflow-y-auto">
      <!-- Timers rendered here -->
    </div>
  </div>

  <!-- Ambient Sound Player Dock Container -->
  <div id="vibe-dock-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderRecipeLibrary();

      // Event listeners for filters
      document.getElementById("search-input").addEventListener("input", renderRecipeLibrary);
      document.getElementById("filter-category").addEventListener("change", renderRecipeLibrary);
      document.getElementById("filter-difficulty").addEventListener("change", renderRecipeLibrary);
      document.getElementById("filter-pantry-match").addEventListener("change", renderRecipeLibrary);
      
      document.getElementById("btn-reset-filters").addEventListener("click", () => {
        document.getElementById("search-input").value = "";
        document.getElementById("filter-category").value = "all";
        document.getElementById("filter-difficulty").value = "all";
        document.getElementById("filter-pantry-match").checked = false;
        renderRecipeLibrary();
      });
    });

    function renderRecipeLibrary() {
      const search = document.getElementById("search-input").value.toLowerCase().trim();
      const cat = document.getElementById("filter-category").value;
      const diff = document.getElementById("filter-difficulty").value;
      const onlyCanMake = document.getElementById("filter-pantry-match").checked;

      const filtered = state.recipes.filter(r => {
        const matchSearch = r.title.toLowerCase().includes(search) || 
                            r.description.toLowerCase().includes(search) ||
                            r.ingredients.some(i => i.name.toLowerCase().includes(search));
        const matchCat = cat === 'all' || r.category === cat;
        const matchDiff = diff === 'all' || r.difficulty === diff;
        
        const matchInfo = computeRecipePantryMatch(r);
        const matchPantry = !onlyCanMake || matchInfo.percent >= 70;

        return matchSearch && matchCat && matchDiff && matchPantry;
      });

      const grid = document.getElementById("recipes-grid");
      const emptyState = document.getElementById("empty-recipes-state");

      if (filtered.length === 0) {
        grid.innerHTML = "";
        emptyState.classList.remove("d-none");
        return;
      }

      emptyState.classList.add("d-none");

      grid.innerHTML = filtered.map(recipe => {
        const match = computeRecipePantryMatch(recipe);
        let badgeClass = "badge-match-high";
        if (match.percent < 70 && match.percent >= 40) badgeClass = "badge-match-med";
        if (match.percent < 40) badgeClass = "badge-match-low";

        return `
          <div class="col-md-6 col-lg-4">
            <div class="glass-card h-100 d-flex flex-column">
              <div class="recipe-card-img-wrapper">
                <img src="${recipe.image}" class="recipe-card-img" alt="${recipe.title}">
                <div class="recipe-badge-time">
                  <i class="far fa-clock me-1"></i> ${recipe.cookTime + recipe.prepTime} mins
                </div>
                <div class="recipe-badge-pantry ${badgeClass}">
                  ${match.percent}% Pantry Match
                </div>
              </div>
              <div class="recipe-card-body">
                <h5 class="font-serif mb-2">${recipe.title}</h5>
                <p class="text-muted small flex-grow-1">${recipe.description}</p>
                
                <div class="mb-3">
                  ${recipe.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
                </div>

                <div class="d-flex align-items-center justify-content-between pt-3 border-top gap-2">
                  <button class="btn btn-sm btn-outline-secondary" onclick="openRecipeDetailModal('${recipe.id}')">
                    <i class="fas fa-eye me-1"></i> Details
                  </button>
                  <a href="cooking.html?id=${recipe.id}" class="btn btn-sm btn-auracook-primary">
                    <i class="fas fa-fire me-1"></i> Cook Now
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openRecipeDetailModal(recipeId) {
      const recipe = state.recipes.find(r => r.id === recipeId);
      if (!recipe) return;

      document.getElementById("modalRecipeTitle").textContent = recipe.title;
      document.getElementById("modalStartCookBtn").href = `cooking.html?id=${recipe.id}`;

      const pantryNames = state.pantry.filter(i => i.status !== 'Out of Stock').map(i => i.name.toLowerCase());

      const body = document.getElementById("modalRecipeBody");
      body.innerHTML = `
        <div class="row g-4">
          <div class="col-md-5">
            <img src="${recipe.image}" class="img-fluid rounded-4 shadow-sm mb-3" alt="${recipe.title}">
            <div class="d-flex flex-wrap gap-2 mb-3">
              <span class="badge bg-sage">${recipe.category}</span>
              <span class="badge bg-terracotta">${recipe.difficulty}</span>
              <span class="badge bg-secondary">${recipe.servings} Servings</span>
            </div>
            <p class="text-muted small">${recipe.description}</p>
          </div>

          <div class="col-md-7">
            <h5 class="font-serif border-bottom pb-2 mb-3"><i class="fas fa-basket-shopping me-2 text-terracotta"></i>Required Ingredients</h5>
            <ul class="list-group list-group-flush mb-4">
              ${recipe.ingredients.map(ing => {
                const inPantry = pantryNames.some(p => p.includes(ing.name.toLowerCase()) || ing.name.toLowerCase().includes(p));
                return `
                  <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0">
                    <span>${ing.amount} ${ing.unit} <strong>${ing.name}</strong></span>
                    ${inPantry ? 
                      '<span class="badge bg-success-subtle text-success"><i class="fas fa-check me-1"></i>In Stock</span>' : 
                      '<span class="badge bg-danger-subtle text-danger"><i class="fas fa-times me-1"></i>Missing</span>'
                    }
                  </li>
                `;
              }).join('')}
            </ul>

            <h5 class="font-serif border-bottom pb-2 mb-3"><i class="fas fa-list-ol me-2 text-terracotta"></i>Instructions Overview</h5>
            <ol class="ps-3 text-muted small">
              ${recipe.instructions.map(inst => `<li class="mb-2">${inst.text}</li>`).join('')}
            </ol>
          </div>
        </div>
      `;

      const modal = new bootstrap.Modal(document.getElementById("recipeDetailModal"));
      modal.show();
    }
  </script>
</body>
</html>
